<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Field Action | Admin Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>


  <style>

    .loading-spin {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #ef4444;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }


    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }


    .tr-hover:hover {
      background-color: #f8fafc;
      transition: all 0.2s;
    }


    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(0.5);
    }


    .modal-active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      visibility: visible;
    }


    .modal-inactive {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
      visibility: hidden;
    }

  </style>

</head>


<body
  class="bg-slate-50 min-h-screen font-sans text-slate-900 overflow-x-hidden"
>


  <!-- ======================================================
       PHOTO MODAL
  ======================================================= -->

  <div
    id="photoModal"
    class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm transition-all duration-300 modal-inactive"
  >

    <div
      class="relative max-w-2xl w-full bg-white rounded-[2.5rem] overflow-hidden shadow-2xl"
    >

      <div
        class="p-6 border-b border-slate-100 flex justify-between items-center"
      >

        <h3
          id="modalTitle"
          class="text-xs font-black uppercase text-slate-800 tracking-widest italic"
        >
          Detail Foto Bukti
        </h3>


        <button
          onclick="closePhotoModal()"
          class="bg-slate-100 hover:bg-red-50 text-slate-400 hover:text-red-600 p-2 rounded-xl"
        >

          ✕

        </button>

      </div>


      <div
        class="p-4 bg-slate-50 flex justify-center items-center min-h-[300px]"
      >

        <img
          id="modalImg"
          src=""
          alt="Bukti Kunjungan"
          class="max-h-[70vh] rounded-2xl shadow-lg border-4 border-white object-contain"
        >

      </div>

    </div>

  </div>



  <!-- ======================================================
       MAP MODAL
  ======================================================= -->

  <div
    id="mapModal"
    class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm transition-all duration-300 modal-inactive"
  >

    <div
      class="relative max-w-4xl w-full bg-white rounded-[2.5rem] overflow-hidden shadow-2xl"
    >

      <div
        class="p-6 border-b border-slate-100 flex justify-between items-center"
      >

        <div>

          <h3
            class="text-xs font-black uppercase text-slate-800 tracking-widest italic"
          >
            Lokasi Check-in
          </h3>

          <p
            id="mapSubtitle"
            class="text-[9px] text-slate-400 font-bold uppercase mt-1"
          ></p>

        </div>


        <button
          onclick="closeMapModal()"
          class="bg-slate-100 hover:bg-red-50 text-slate-400 hover:text-red-600 p-2 rounded-xl"
        >

          ✕

        </button>

      </div>


      <div class="w-full aspect-video bg-slate-100">

        <iframe
          id="mapFrame"
          width="100%"
          height="100%"
          frameborder="0"
          style="border:0"
          allowfullscreen
          loading="lazy"
        ></iframe>

      </div>

    </div>

  </div>



  <!-- ======================================================
       NAVBAR
  ======================================================= -->

  <nav
    class="bg-slate-900 text-white p-5 sticky top-0 z-50 shadow-xl"
  >

    <div
      class="max-w-6xl mx-auto flex justify-between items-center"
    >

      <div class="flex items-center gap-3">

        <div class="bg-red-600 p-2 rounded-lg">

          📍

        </div>


        <h1
          class="font-black uppercase tracking-widest text-lg"
        >

          Field Action

          <span class="text-red-500 italic">
            Admin
          </span>

        </h1>

      </div>


      <button
        onclick="loadData()"
        class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-xl text-xs font-black transition-all active:scale-95 flex items-center gap-2 uppercase"
      >

        ↻

        Sync

      </button>

    </div>

  </nav>



  <!-- ======================================================
       MAIN
  ======================================================= -->

  <div
    class="max-w-6xl mx-auto p-6 space-y-8"
  >


    <!-- SUMMARY -->

    <section>

      <div
        class="flex items-center justify-between mb-4 px-2"
      >

        <h2
          class="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em]"
        >
          Monitoring Progress
        </h2>


        <span
          id="dateDisplay"
          class="text-[10px] font-bold text-slate-600 bg-white border border-slate-200 px-4 py-1.5 rounded-full uppercase shadow-sm italic tracking-widest"
        >
          ---
        </span>

      </div>


      <div
        id="summaryCards"
        class="flex gap-4 overflow-x-auto pb-4 scrollbar-hide"
      >

        <div
          class="min-w-[240px] bg-white p-6 rounded-[2.5rem] border border-slate-200 animate-pulse"
        >

          <div
            class="h-2 w-20 bg-slate-100 rounded mb-4"
          ></div>

          <div
            class="h-8 w-16 bg-slate-100 rounded"
          ></div>

        </div>

      </div>

    </section>



    <!-- TABLE -->

    <section
      class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 overflow-hidden"
    >

      <div
        class="p-8 border-b border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-6"
      >

        <div>

          <h2
            class="text-xs font-black uppercase text-slate-800 tracking-widest italic border-l-4 border-red-500 pl-3"
          >

            History Kunjungan

          </h2>

        </div>


        <div
          class="flex items-center gap-3 w-full md:w-auto"
        >

          <input
            type="date"
            id="filterTanggal"
            class="w-full bg-slate-100 border-2 border-transparent focus:border-red-500 rounded-2xl px-5 py-2.5 text-[11px] font-black uppercase text-slate-700 outline-none transition-all"
            onchange="loadData()"
          >


          <div
            id="totalVisitBadge"
            class="bg-slate-900 text-white px-5 py-3 rounded-2xl text-[10px] font-black whitespace-nowrap shadow-lg"
          >
            0 VISIT
          </div>

        </div>

      </div>



      <div class="overflow-x-auto">

        <table
          class="w-full text-left border-collapse"
        >

          <thead>

            <tr
              class="bg-slate-50/50 border-b border-slate-200 text-[10px] font-black uppercase text-slate-500 tracking-[0.15em]"
            >

              <th class="p-8">
                Sales
              </th>

              <th class="p-8">
                Toko / Outlet
              </th>

              <th class="p-8">
                Waktu
              </th>

              <th class="p-8">
                Titik GPS
              </th>

              <th class="p-8 text-center">
                Bukti
              </th>

            </tr>

          </thead>


          <tbody id="tableBody">

          </tbody>

        </table>

      </div>

    </section>

  </div>



  <!-- ======================================================
       JAVASCRIPT
  ======================================================= -->

  <script>

    /*
     * PENTING:
     * GANTI DENGAN URL DEPLOYMENT /exec KAMU
     */

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzv1Slj2BHWSiFkzwndJlGcJWjTyB2Z5hF2cNgD_rkkb2oyLNYAn1ktl1bNFY6YZWYu/exec";


    /* =====================================================
       INIT
    ===================================================== */

    window.onload = function () {

      const today =
        getLocalDateString();


      document
        .getElementById("filterTanggal")
        .value = today;


      loadData();

    };


    /* =====================================================
       LOCAL DATE
    ===================================================== */

    function getLocalDateString() {

      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");


      const day =
        String(
          now.getDate()
        ).padStart(2, "0");


      return (
        year
        + "-"
        + month
        + "-"
        + day
      );

    }


    /* =====================================================
       API
    ===================================================== */

    async function callAPI(payload) {

      console.log(
        "API REQUEST:",
        payload
      );


      try {

        const response =
          await fetch(
            SCRIPT_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(payload),

              redirect:
                "follow"
            }
          );


        console.log(
          "HTTP STATUS:",
          response.status
        );


        if (!response.ok) {

          throw new Error(
            "HTTP "
            + response.status
            + " "
            + response.statusText
          );

        }


        const text =
          await response.text();


        console.log(
          "API RESPONSE:",
          text
        );


        if (!text) {

          throw new Error(
            "Server mengirim response kosong"
          );

        }


        let data;


        try {

          data =
            JSON.parse(text);

        } catch (error) {

          console.error(
            "INVALID JSON:",
            text
          );


          throw new Error(
            "Response server bukan JSON"
          );

        }


        return data;


      } catch (error) {

        console.error(
          "API ERROR:",
          error
        );


        showError(
          "Gagal terhubung ke server: "
          + error.message
        );


        return null;

      }

    }


    /* =====================================================
       LOAD DATA
    ===================================================== */

    async function loadData() {

      const selectedDate =
        document
          .getElementById(
            "filterTanggal"
          )
          .value;


      if (!selectedDate) {
        return;
      }


      document
        .getElementById(
          "tableBody"
        )
        .innerHTML = `

          <tr>

            <td
              colspan="5"
              class="p-24 text-center"
            >

              <div
                class="loading-spin mx-auto"
              ></div>

              <p
                class="mt-4 text-[10px] font-black uppercase text-slate-400"
              >
                Loading data...
              </p>

            </td>

          </tr>

        `;


      const summaryData =
        await callAPI({
          action:
            "getSummary",

          data:
            selectedDate
        });


      const logsData =
        await callAPI({
          action:
            "getLogs",

          data:
            selectedDate
        });


      renderSummary(
        summaryData
      );


      renderTable(
        logsData
      );


      updateDateDisplay(
        selectedDate
      );

    }


    /* =====================================================
       DATE DISPLAY
    ===================================================== */

    function updateDateDisplay(
      selectedDate
    ) {

      const date =
        new Date(
          selectedDate
          + "T00:00:00"
        );


      const options = {

        weekday:
          "long",

        year:
          "numeric",

        month:
          "long",

        day:
          "numeric"

      };


      document
        .getElementById(
          "dateDisplay"
        )
        .innerText =
          date.toLocaleDateString(
            "id-ID",
            options
          );

    }


    /* =====================================================
       SUMMARY
    ===================================================== */

    function renderSummary(
      data
    ) {

      const container =
        document.getElementById(
          "summaryCards"
        );


      if (
        !data ||
        !Array.isArray(data)
      ) {

        container.innerHTML = `

          <p
            class="text-red-500 text-[10px] font-black p-4 uppercase"
          >
            Gagal mengambil summary
          </p>

        `;

        return;

      }


      if (data.length === 0) {

        container.innerHTML = `

          <p
            class="text-slate-400 text-[10px] font-black p-4 uppercase italic"
          >
            No summary data found.
          </p>

        `;

        return;

      }


      container.innerHTML =
        data.map(
          function (s) {

            const persen =
              s.target > 0
                ? Math.round(
                    (
                      s.realisasi
                      /
                      s.target
                    ) * 100
                  )
                : 0;


            return `

              <div
                class="min-w-[260px] bg-white p-7 rounded-[2.5rem] shadow-sm border border-slate-200 hover:border-red-200 transition-all"
              >

                <p
                  class="text-red-600 font-black text-[10px] uppercase mb-1 tracking-widest"
                >
                  ${escapeHTML(s.nama)}
                </p>


                <div
                  class="flex justify-between items-end mb-4"
                >

                  <h3
                    class="text-4xl font-black text-slate-900"
                  >
                    ${persen}%
                  </h3>


                  <p
                    class="text-[9px] font-bold text-slate-400 uppercase italic"
                  >
                    Target Hit
                  </p>

                </div>


                <div
                  class="text-[10px] font-bold flex justify-between text-slate-400"
                >

                  <span>
                    ${s.realisasi} Done
                  </span>

                  <span>
                    ${s.target} Plan
                  </span>

                </div>

              </div>

            `;

          }
        ).join("");

    }


    /* =====================================================
       TABLE
    ===================================================== */

    function renderTable(
      data
    ) {

      const tbody =
        document.getElementById(
          "tableBody"
        );


      const badge =
        document.getElementById(
          "totalVisitBadge"
        );


      if (
        !data ||
        !Array.isArray(data)
      ) {

        tbody.innerHTML = `

          <tr>

            <td
              colspan="5"
              class="p-32 text-center text-red-400 font-black uppercase text-[10px]"
            >
              Gagal mengambil data kunjungan
            </td>

          </tr>

        `;


        badge.innerText =
          "ERROR";


        return;

      }


      if (data.length === 0) {

        tbody.innerHTML = `

          <tr>

            <td
              colspan="5"
              class="p-32 text-center text-slate-300 font-black uppercase text-[10px] tracking-widest"
            >
              Tidak ada record kunjungan
            </td>

          </tr>

        `;


        badge.innerText =
          "0 VISIT";


        return;

      }


      badge.innerText =
        data.length
        + " VISIT TERCATAT";


      tbody.innerHTML =
        data.map(
          function (item) {

            const sales =
              escapeHTML(
                item.sales || ""
              );


            const toko =
              escapeHTML(
                item.toko || ""
              );


            const lokasi =
              escapeHTML(
                item.lokasi || ""
              );


            const foto =
              escapeHTML(
                item.foto || ""
              );


            const initial =
              escapeHTML(
                (
                  item.sales || "?"
                )
                .charAt(0)
              );


            return `

              <tr
                class="border-b border-slate-50 tr-hover"
              >

                <td class="p-8">

                  <div
                    class="flex items-center gap-3"
                  >

                    <div
                      class="w-8 h-8 bg-slate-900 text-white rounded-full flex items-center justify-center font-black text-[10px] uppercase"
                    >
                      ${initial}
                    </div>


                    <p
                      class="font-black text-slate-900 text-[11px] uppercase"
                    >
                      ${sales}
                    </p>

                  </div>

                </td>


                <td class="p-8">

                  <p
                    class="font-bold text-slate-700 uppercase text-[11px] leading-tight"
                  >
                    ${toko}
                  </p>

                </td>


                <td class="p-8 text-[11px]">

                  <span
                    class="font-black text-slate-900"
                  >
                    ${escapeHTML(item.tanggal || "")}
                  </span>

                  <br>

                  <span
                    class="font-bold text-red-500 uppercase tracking-tighter italic"
                  >
                    ${escapeHTML(item.jam || "")}
                  </span>

                </td>


                <td class="p-8">

                  <button
                    onclick="openMapModal(
                      ${JSON.stringify(item.lokasi || "")},
                      ${JSON.stringify(item.sales || "")},
                      ${JSON.stringify(item.toko || "")}
                    )"
                    class="flex items-center gap-2 group text-left"
                  >

                    <span
                      class="text-[9px] font-black text-slate-400 uppercase bg-slate-100 group-hover:text-red-600 px-3 py-1.5 rounded-lg border transition-all"
                    >
                      Lihat GPS
                    </span>

                    📍

                  </button>

                </td>


                <td class="p-8 text-center">

                  ${
                    foto
                      ? `

                        <button
                          onclick="openPhotoModal(
                            ${JSON.stringify(item.foto || "")},
                            ${JSON.stringify(item.sales || "")},
                            ${JSON.stringify(item.toko || "")}
                          )"
                          class="bg-slate-900 text-white px-5 py-2.5 rounded-xl text-[10px] font-black hover:bg-red-600 transition-all uppercase shadow-md active:scale-95 inline-flex items-center gap-2"
                        >

                          🖼️ Foto

                        </button>

                      `
                      :
                      `

                        <span
                          class="text-[9px] text-slate-300 font-black uppercase"
                        >
                          Tidak ada foto
                        </span>

                      `
                  }

                </td>

              </tr>

            `;

          }
        ).join("");

    }


    /* =====================================================
       PHOTO MODAL
    ===================================================== */

    function openPhotoModal(
      imgUrl,
      sales,
      toko
    ) {

      const modal =
        document.getElementById(
          "photoModal"
        );


      document
        .getElementById(
          "modalTitle"
        )
        .innerText =
          "Visit: "
          + sales
          + " @ "
          + toko;


      document
        .getElementById(
          "modalImg"
        )
        .src =
          imgUrl;


      modal.classList.replace(
        "modal-inactive",
        "modal-active"
      );

    }


    function closePhotoModal() {

      const modal =
        document.getElementById(
          "photoModal"
        );


      document
        .getElementById(
          "modalImg"
        )
        .src = "";


      modal.classList.replace(
        "modal-active",
        "modal-inactive"
      );

    }


    /* =====================================================
       MAP
    ===================================================== */

    function openMapModal(
      lokasiRaw,
      sales,
      toko
    ) {

      if (!lokasiRaw) {

        alert(
          "Lokasi GPS tidak tersedia."
        );

        return;

      }


      /*
       * Mendukung:
       * LAT:-1.234 LNG:98.123
       * LAT:-1.234,LNG:98.123
       * -1.234,98.123
       */

      let coords =
        lokasiRaw
          .replace(
            /LAT:/gi,
            ""
          )
          .replace(
            /LNG:/gi,
            ""
          )
          .replace(
            /\s+/g,
            ""
          );


      const mapUrl =
        "https://maps.google.com/maps?q="
        + encodeURIComponent(coords)
        + "&z=15&output=embed";


      document
        .getElementById(
          "mapSubtitle"
        )
        .innerText =
          sales
          + " | "
          + toko;


      document
        .getElementById(
          "mapFrame"
        )
        .src =
          mapUrl;


      document
        .getElementById(
          "mapModal"
        )
        .classList.replace(
          "modal-inactive",
          "modal-active"
        );

    }


    function closeMapModal() {

      document
        .getElementById(
          "mapModal"
        )
        .classList.replace(
          "modal-active",
          "modal-inactive"
        );


      document
        .getElementById(
          "mapFrame"
        )
        .src = "";

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      console.error(
        message
      );

      alert(
        message
      );

    }


    /* =====================================================
       CLOSE MODAL WHEN CLICK OUTSIDE
    ===================================================== */

    document
      .getElementById(
        "photoModal"
      )
      .addEventListener(
        "click",
        function (e) {

          if (
            e.target === this
          ) {

            closePhotoModal();

          }

        }
      );


    document
      .getElementById(
        "mapModal"
      )
      .addEventListener(
        "click",
        function (e) {

          if (
            e.target === this
          ) {

            closeMapModal();

          }

        }
      );

  </script>

</body>

</html>
