<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin</title>
  <link rel="icon" href="img/logo.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Style untuk Pop-up */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .popup-content {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .popup-content img {
      max-width: 100%;
      max-height: 80dvh;
      display: block;
      border-radius: 4px;
    }

    .popup-close {
      position: absolute;
      top: -15px;
      right: -15px;
      background: #ff4d4d;
      color: white;
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .popup-close:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>
  <!-- Pop-up Gambar -->
  <div id="imagePopup" class="popup-overlay">
    <div class="popup-content">
      <button class="popup-close" onclick="closePopup()">&times;</button>
      <img src="img/popup.jpeg" alt="Popup Info" />
    </div>
  </div>

  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbwwI4iA-oCTf22jwyxUZF0iEAsszTfaZfdhvtHIBwlZsr6897g8L13QXan-7dmKuEMWDQ/exec?page=admin"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <script>
    function closePopup() {
      const popup = document.getElementById('imagePopup');
      popup.style.display = 'none';
    }
  </script>
</body>
</html>
