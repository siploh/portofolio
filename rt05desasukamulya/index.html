<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RT 05 Desa Suka Mulya</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  
  <link rel="icon" href="img/logo.png" />
  <link rel="apple-touch-icon" href="img/logo.png" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #2c3e50;
      color: #white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-width: 320px;
      width: 90%;
    }
    img {
      width: 80px;
      height: 80px;
      margin-bottom: 15px;
    }
    h2 {
      color: #2c3e50;
      font-size: 20px;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn-install {
      background-color: #27ae60;
      margin-top: 10px;
      display: none; /* Sembunyikan tombol sebelum siap */
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="img/logo.png" alt="Logo RT 05">
    <h2>RT 05 Suka Mulya</h2>
    <p>Silakan masuk ke sistem aplikasi warga.</p>
    
    <!-- Tombol untuk langsung menuju Google Apps Script -->
    <a href="https://script.google.com/macros/s/AKfycbxgMOSyndP2uU1LZdWArpwN4SrxoUXx9oRLSD2U1sO7KT-mBJEzPO2JeQyW_eq82vY7VQ/exec" class="btn">Masuk Aplikasi</a>
    
    <!-- Tombol Install PWA otomatis yang muncul di halaman -->
    <button id="installBtn" class="btn btn-install">Instal Aplikasi</button>
  </div>

  <script>
    // 1. Pendaftaran Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('Service Worker OK:', reg.scope))
          .catch((err) => console.log('Service Worker Gagal:', err));
      });
    }

    // 2. Skrip penangkap event PWA untuk memunculkan tombol Instal
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Cegah banner otomatis muncul jika ingin dikendalikan tombol kustom
      e.preventDefault();
      deferredPrompt = e;
      // Tampilkan tombol instal di halaman
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('Pengguna menyetujui instalasi');
        }
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
