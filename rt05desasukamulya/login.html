<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RT 05 Desa Suka Mulya</title>
  <link rel="icon" href="img/logo.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      /* Mengizinkan scrolling agar bagian bawah tidak terpotong */
      overflow: auto; 
      -webkit-overflow-scrolling: touch;
    }

    .iframe-container {
      width: 100%;
      /* Menggunakan min-height agar kontainer bisa menyesuaikan isi ke bawah */
      min-height: 100%;
      height: 100%;
      overflow: visible;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: none;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbxIDEW3Ua1vz6escikZ-j-wwUXUiFdUl0KHfC2p0UtohT4PTu6D3NGm4HBtoni8qHnuMw/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation; clipboard-read; clipboard-write;">
    </iframe>
  </div>
</body>
</html>
