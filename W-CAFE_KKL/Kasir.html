<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kasir</title>
  <link rel="icon" href="img/logo.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed; /* Memaksa WebView Huawei mengunci viewport */
      top: 0;
      left: 0;
      background-color: #eee;
    }
    #app {
      position: absolute;
      top: 0;
      left: 0;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbyRWWKPf65V4x0XUwvd23kOkEGZve7YuPZCi8oyElLQJOkMBoIKCmF2er43Cdf_vwr92g/exec"
    scrolling="yes"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true"
    allow="fullscreen; camera; microphone; display-capture; geolocation;">
  </iframe>

  <script>
    function forceFullScreen() {
      const iframe = document.getElementById('app');
      // Mengambil piksel asli layar Huawei untuk memotong bug CSS Huawei WebKit
      const actualHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      const actualWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;

      iframe.style.height = actualHeight + 'px';
      iframe.style.width = actualWidth + 'px';
    }

    // Jalankan penyesuaian saat dimuat, di-resize, atau diputar layarnya
    window.addEventListener('load', forceFullScreen);
    window.addEventListener('resize', forceFullScreen);
    window.addEventListener('orientationchange', forceFullScreen);
  </script>
</body>
</html>
