<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Data Stream Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050505; /* Latar belakang gelap total */
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace; /* Font bergaya terminal */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            position: relative;
        }
        h1 {
            font-size: 7rem;
            color: #00e676; /* Hijau neon terang */
            margin-bottom: -10px;
            text-shadow: 0 0 15px rgba(0, 230, 118, 0.7);
            font-weight: bold;
        }
        h1 span {
            color: #fff; /* Warna untuk angka '0' di tengah */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }
        p {
            color: #b0b0b0;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
        canvas {
            background: #080808;
            /* Border futuristik */
            border: 2px solid #333;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.15);
            /* Mencegah seleksi teks saat main */
            user-select: none; 
        }
        .instructions {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>4<span>0</span>4</h1>
        <p>Halaman Yang Anda Masukan Tidak Ditemukan.</p>
        
        <canvas id="gameCanvas" width="700" height="250"></canvas>
        
        <div class="instructions">
            Tekan <strong>SPASI</strong> untuk melakukan lompatan taktis.
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- Konfigurasi Game yang Diperbarui ---
        let score = 0;
        let isGameOver = false;
        let gameSpeed = 6;
        let highScore = localStorage.getItem('404highScore') || 0;

        // Latar belakang bintang
        let stars = [];
        for(let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.2
            });
        }

        // Karakter (Hacker Pixel)
        const player = {
            x: 80,
            y: 170, // Disesuaikan dengan tinggi baru
            width: 35,
            height: 45,
            dy: 0,
            jumpForce: -13, // Lompatan lebih tinggi sedikit
            gravity: 0.7,
            grounded: false,
            color: "#00e676", // Hijau neon
            particles: []
        };

        // Rintangan (Firewall)
        let obstacles = [];
        let obstacleTimer = 0;
        let nextObstacleTime = 90;

        // --- Input Handler ---
        document.addEventListener("keydown", function(e) {
            if ((e.code === "Space" || e.code === "ArrowUp") && player.grounded) {
                player.dy = player.jumpForce;
                player.grounded = false;
                e.preventDefault();
            }
            if (e.code === "Space" && isGameOver) {
                resetGame();
            }
        });

        function resetGame() {
            if(score > highScore) {
                highScore = score;
                localStorage.setItem('404highScore', highScore);
            }
            score = 0;
            isGameOver = false;
            obstacles = [];
            gameSpeed = 6;
            player.y = 170;
            player.dy = 0;
            nextObstacleTime = 90;
        }

        function spawnObstacle() {
            const type = Math.random();
            let height, width;
            if (type < 0.7) {
                // Kotak biasa
                width = 30;
                height = 30 + Math.random() * 40;
            } else {
                // Rintangan tinggi (harus melompat sempurna)
                width = 20;
                height = 100 + Math.random() * 20;
            }
            
            obstacles.push({
                x: canvas.width,
                y: 215 - height, // Dasar lantai di 215
                width: width,
                height: height,
                color: "#ff5252", // Merah peringatan
                passed: false // Untuk cek skor
            });
        }

        function createParticles() {
            if (player.grounded && Math.random() > 0.5) {
                player.particles.push({
                    x: player.x + 10,
                    y: player.y + player.height - 5,
                    size: Math.random() * 3 + 1,
                    speedX: -gameSpeed - 1,
                    life: 20
                });
            }
            // Update dan gambar partikel
            for (let i = 0; i < player.particles.length; i++) {
                const p = player.particles[i];
                p.x += p.speedX;
                p.life--;
                ctx.fillStyle = `rgba(0, 230, 118, ${p.life / 30})`;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                
                if (p.life <= 0) {
                    player.particles.splice(i, 1);
                    i--;
                }
            }
        }

        function update() {
            if (isGameOver) return;

            // Update Latar Belakang Bintang
            for(let star of stars) {
                star.x -= star.speed;
                if(star.x < 0) star.x = canvas.width;
            }

            // Gravitasi Player & Partikel
            player.dy += player.gravity;
            player.y += player.dy;

            // Batas Tanah (Disesuaikan)
            if (player.y > 215 - player.height) {
                player.y = 215 - player.height;
                player.dy = 0;
                player.grounded = true;
            }

            // Kelola Rintangan
            obstacleTimer++;
            if (obstacleTimer >= nextObstacleTime) {
                spawnObstacle();
                obstacleTimer = 0;
                nextObstacleTime = Math.floor(Math.random() * 50) + 80; // Jarak lebih bervariasi
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Deteksi Tabrakan (Hitbox lebih presisi sedikit)
                if (
                    player.x < obs.x + obs.width - 5 &&
                    player.x + player.width > obs.x + 5 &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    isGameOver = true;
                }

                // Tambah Skor saat melewati rintangan
                if (obs.x + obs.width < player.x && !obs.passed) {
                    score += 10;
                    obs.passed = true;
                    // Akselerasi lebih terasa
                    if (score % 100 === 0) {
                        gameSpeed += 0.8; 
                    }
                }

                // Hapus rintangan keluar layar
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            // Bersihkan Layar dengan efek motion blur tipis (opsional, dimatikan untuk performa)
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gambar Bintang
            ctx.fillStyle = "#fff";
            for(let star of stars) {
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }

            // Gambar "Garis Tanah Data"
            ctx.strokeStyle = "#00e676";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 215);
            ctx.lineTo(canvas.width, 215);
            ctx.stroke();
            
            // Efek garis scanline di background (tipis)
            ctx.fillStyle = "rgba(0, 255, 0, 0.03)";
            for(let i = 0; i < canvas.height; i += 4) {
                ctx.fillRect(0, i, canvas.width, 1);
            }

            // Gambar Partikel Player
            createParticles();

            // Gambar Player (Bentuk kotak dengan sedikit detail)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Mata/Detail kecil
            ctx.fillStyle = "#050505";
            ctx.fillRect(player.x + 8, player.y + 10, 5, 5);
            ctx.fillRect(player.x + 22, player.y + 10, 5, 5);

            // Gambar Rintangan (Gaya Firewall/Blok Data)
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                // Gradient warna merah
                let gradient = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
                gradient.addColorStop(0, "#ff5252");
                gradient.addColorStop(1, "#b71c1c");
                ctx.fillStyle = gradient;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                // Detail garis-garis pada firewall
                ctx.fillStyle = "rgba(255,255,255,0.3)";
                for(let j = obs.y + 5; j < obs.y + obs.height; j += 8) {
                     ctx.fillRect(obs.x + 2, j, obs.width - 4, 2);
                }
            }

            // Tampilkan Skor & High Score
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Courier New', monospace";
            ctx.textAlign = "right";
            ctx.fillText("SCORE: " + score, canvas.width - 20, 30);
            ctx.font = "12px 'Courier New', monospace";
            ctx.fillText("HI-SCORE: " + highScore, canvas.width - 20, 50);
            ctx.textAlign = "left";

            // Tampilan Game Over
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff5252";
                ctx.font = "bold 50px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText("SYSTEM FAILURE", canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.font = "18px 'Courier New', monospace";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("Skor Akhir: " + score, canvas.width / 2, canvas.height / 2 + 25);
                
                ctx.font = "14px 'Courier New', monospace";
                ctx.fillStyle = "#b0b0b0";
                ctx.fillText("[Tekan SPASI untuk Reboot]", canvas.width / 2, canvas.height / 2 + 55);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Mulai Game
        loop();
    </script>
</body>
</html>
